name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Restore
        run: dotnet restore KoiFengShuiSystem.sln

      - name: Build
        run: dotnet build KoiFengShuiSystem.sln --no-restore --nologo -v q

      - name: Test (unit)
        run: >
          dotnet test tests/UnitTests/UnitTests.csproj --no-build --nologo -v q
          --collect:"XPlat Code Coverage" --
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
          -results-directory ./coverage

      - name: Test (integration)
        run: dotnet test tests/IntegrationTests/IntegrationTests.csproj --no-build --nologo -v q

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage-cobertura
          path: ./coverage/**/*.cobertura.xml
          if-no-files-found: ignore
